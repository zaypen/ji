[package]
name = "ji"
version = "0.1.0"
edition = "2021"
description = "Voice dictation as a Unix pipe: 16 kHz mono PCM in, words out"
license = "MIT"
repository = "https://github.com/zaypen/ji"
homepage = "https://github.com/zaypen/ji"
keywords = ["speech-to-text", "dictation", "cli", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
ureq = "2"
opus = "0.3"
libc = "0.2"

# The glue that a hotkey presses, delivered as a binary because installers install binaries.
# See src/dictate.rs; the logic stays in contrib/ji-dictate.
[[bin]]
name = "ji-dictate"
path = "src/dictate.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
